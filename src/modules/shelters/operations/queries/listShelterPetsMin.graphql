query listShelterPetsMin($commonSearch: CommonSearch) {
	listShelterPets(commonSearch: $commonSearch) {
		items {
			id
			pet {
				id
				name
				gender
				years
				main_picture {
					id
					main_color {
						color
						contrast
					}
				}
			}
		}
		success
		error {
			code
			message
		}
	}
}
