query listPetsNeedingWalk($shelter_id: ID!, $hours: Int) {
	listPetsNeedingWalk(shelter_id: $shelter_id, hours: $hours) {
		items {
			id
			pet {
				id
				name
				main_picture {
					id
				}
			}
			assigned_members {
				id
				first_name
				last_name
			}
			assigned_shelter_people {
				id
				first_name
				last_name
			}
		}
		success
		error {
			code
			message
		}
	}
}
