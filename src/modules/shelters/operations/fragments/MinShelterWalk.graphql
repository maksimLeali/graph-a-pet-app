fragment MinShelterWalk on ShelterWalk {
	id
	status
	scheduled_at
	started_at
	ended_at
	duration_minutes
	notes
	ratings {
		id
		type
		rating
	}
	walker {
		id
		first_name
		last_name
	}
	walker_shelter_person {
		id
		first_name
		last_name
	}
	shelter_pet {
		id
		pet {
			id
			name
			main_picture {
				id
			}
		}
	}
}
