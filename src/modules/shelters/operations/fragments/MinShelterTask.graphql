fragment MinShelterTask on ShelterTask {
	id
	task_type
	area
	status
	scheduled_at
	completed_at
	is_recurring
	recurrence {
		freq
		interval
		weekdays
		week_ordinal
		time_of_day
		start_at
	}
	notes
	assignees {
		id
		first_name
		last_name
	}
	shelter_pet {
		id
		pet {
			id
			name
		}
	}
}
