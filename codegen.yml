# codegen.yml
schema: "./graphql-schema.json"
documents:
  - "src/**/*.graphql"
  - "src/**/*.{ts,tsx}"
  # escludi i file già generati (in src e a livello root)
  - "!src/**/__generated__/**"
  - "!**/__generated__/**"
  - "!src/types.ts"
generates:
  src/types.ts:
    plugins:
      - typescript
      - typescript-operations
      - typescript-react-apollo
  src/:
    preset: near-operation-file
    presetConfig:
      baseTypesPath: types.ts
      extension: .generated.ts
      folder: ../__generated__
    plugins:
      - typescript-operations
      - typescript-react-apollo
